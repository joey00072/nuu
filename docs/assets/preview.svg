  <text x="30" y="555" font-family="Menlo, Consolas, monospace" font-size="23" font-style="italic" fill="#9a9a9a">The repo is "Nuu" - a Python implementation of Pi's terminal coding-agent architecture. One line should capture the essence.</text>

  <text x="30" y="650" font-family="Menlo, Consolas, monospace" font-size="25" fill="#f0f0f0">Nuu is a Python reimplementation of Pi's terminal-based coding-agent architecture, cleanly split into four</text>
  <text x="30" y="700" font-family="Menlo, Consolas, monospace" font-size="25" fill="#f0f0f0">layers: provider adapters, an agent runtime, a coding agent with tools/sessions/prompts, and a raw ANSI terminal</text>
  <text x="30" y="750" font-family="Menlo, Consolas, monospace" font-size="25" fill="#f0f0f0">UI engine.</text>

